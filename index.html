<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO_object丰收 · CYBERPUNK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #060b11;
  --surface: #0a101b;
  --surface2: #0f1723;
  --border: #1a2840;
  --border-glow: #243d60;
  --cyan: #00e5ff;
  --magenta: #e040fb;
  --purple: #7c4dff;
  --green: #69f0ae;
  --gold: #ffd740;
  --red: #ff5252;
  --amber: #ff9100;
  --text: #e0e6f0;
  --text2: #8899bb;
  --muted: #4a5878;
  --font: 'DM Sans', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
  --font-display: 'Space Grotesk', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── SCANLINE OVERLAY ─── */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.015) 2px, rgba(0,0,0,0.015) 4px);
  pointer-events: none; z-index: 0; opacity: 0.25;
}

/* ─── PARTICLE CANVAS ─── */
#particles {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
}

/* ─── BACKGROUND AMBIANCE ─── */
.bg-grid {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(128,216,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 85% 100%, rgba(255,107,203,0.07) 0%, transparent 50%),
    radial-gradient(circle at 15% 65%, rgba(179,136,255,0.06) 0%, transparent 50%),
    radial-gradient(circle at 70% 40%, rgba(64,196,255,0.04) 0%, transparent 40%);
}
.bg-grid::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(128,216,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(179,136,255,0.05) 1px, transparent 1px);
  background-size: 54px 54px;
  mask-image: radial-gradient(ellipse at 50% 10%, black 25%, transparent 65%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 10%, black 25%, transparent 65%);
}
/* perspective grid lines */
.bg-grid::after {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      transparent 0%,
      rgba(128,216,255,0.03) 15%,
      rgba(128,216,255,0.07) 30%,
      rgba(179,136,255,0.05) 45%,
      rgba(255,107,203,0.04) 60%,
      rgba(255,107,203,0.07) 75%,
      transparent 100%);
  opacity: 0.6;
}

/* ─── FLOATING NEON ORBS ─── */
.bg-orbs {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.bg-orbs::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(128,216,255,0.14) 0%, rgba(128,216,255,0.06) 25%, transparent 55%);
  top: -150px; right: -80px;
  animation: orb1 16s ease-in-out infinite;
}
.bg-orbs::after {
  content: '';
  position: absolute;
  width: 450px; height: 450px;
  background: radial-gradient(circle, rgba(255,107,203,0.12) 0%, rgba(255,107,203,0.05) 25%, transparent 55%);
  bottom: -120px; left: -80px;
  animation: orb2 20s ease-in-out infinite;
}
.bg-orb3 {
  position: fixed; pointer-events: none; z-index: 0;
  width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(179,136,255,0.09) 0%, transparent 55%);
  top: 50%; left: 60%;
  animation: orb3 15s ease-in-out infinite;
}
.bg-orb4 {
  position: fixed; pointer-events: none; z-index: 0;
  width: 250px; height: 250px;
  background: radial-gradient(circle, rgba(255,128,180,0.08) 0%, transparent 50%);
  top: 15%; left: 8%;
  animation: orb4 12s ease-in-out infinite;
}
@keyframes orb1 {
  0%,100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(-80px,60px) scale(1.25); }
  66% { transform: translate(40px,-40px) scale(0.82); }
}
@keyframes orb2 {
  0%,100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(60px,-50px) scale(1.3); }
  66% { transform: translate(-40px,40px) scale(0.88); }
}
@keyframes orb3 {
  0%,100% { transform: translate(0,0) scale(1); opacity: 0.4; }
  50% { transform: translate(-40px,-30px) scale(1.4); opacity: 0.8; }
}
@keyframes orb4 {
  0%,100% { transform: translate(0,0) scale(0.8); opacity: 0.3; }
  50% { transform: translate(30px,25px) scale(1.3); opacity: 0.7; }
}

/* ─── GEOMETRIC ACCENTS ─── */
.bg-wire {
  position: fixed; pointer-events: none; z-index: 0;
  border: 1px solid rgba(128,216,255,0.07);
  box-shadow: 0 0 12px rgba(128,216,255,0.04), 0 0 30px rgba(128,216,255,0.02);
}
.bg-wire.w1 {
  width: 320px; height: 320px;
  border-radius: 50%;
  top: 30%; left: -80px;
  animation: wireFloat1 22s linear infinite;
}
.bg-wire.w2 {
  width: 200px; height: 200px;
  border-radius: 8px;
  top: 55%; right: -50px;
  border-color: rgba(255,107,203,0.06);
  box-shadow: 0 0 12px rgba(255,107,203,0.04);
  transform: rotate(25deg);
  animation: wireFloat2 18s linear infinite;
}
.bg-wire.w3 {
  width: 180px; height: 180px;
  border-radius: 3px;
  top: 12%; left: 55%;
  border-color: rgba(179,136,255,0.05);
  box-shadow: 0 0 12px rgba(179,136,255,0.03);
  transform: rotate(45deg);
  animation: wireFloat3 20s linear infinite;
}
@keyframes wireFloat1 {
  0% { transform: translate(0,0) rotate(0deg); }
  100% { transform: translate(30px,-40px) rotate(360deg); }
}
@keyframes wireFloat2 {
  0% { transform: translate(0,0) rotate(25deg); }
  100% { transform: translate(-25px,35px) rotate(385deg); }
}
@keyframes wireFloat3 {
  0% { transform: translate(0,0) rotate(45deg); }
  100% { transform: translate(20px,-25px) rotate(405deg); }
}

/* ─── DATA STREAM LINES ─── */
.bg-stream {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-stream span {
  position: absolute; display: block; opacity: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(128,216,255,0.5), transparent);
  box-shadow: 0 0 6px rgba(128,216,255,0.4);
  animation: streamGlide 8s ease-in-out infinite;
}
.bg-stream span:nth-child(1) { width: 300px; top: 18%; left: -10%; animation-delay: 0s; }
.bg-stream span:nth-child(2) { width: 220px; top: 42%; left: -8%; animation-delay: 2.5s; background: linear-gradient(90deg, transparent, rgba(255,107,203,0.4), transparent); box-shadow: 0 0 6px rgba(255,107,203,0.35); }
.bg-stream span:nth-child(3) { width: 260px; top: 68%; left: -6%; animation-delay: 5s; }
.bg-stream span:nth-child(4) { width: 180px; top: 80%; left: -12%; animation-delay: 1.5s; background: linear-gradient(90deg, transparent, rgba(179,136,255,0.35), transparent); box-shadow: 0 0 6px rgba(179,136,255,0.3); }
.bg-stream span:nth-child(5) { width: 280px; top: 25%; left: -15%; animation-delay: 3.8s; background: linear-gradient(90deg, transparent, rgba(128,216,255,0.35), transparent); box-shadow: 0 0 6px rgba(128,216,255,0.3); }
@keyframes streamGlide {
  0%   { transform: translateX(0); opacity: 0; }
  15%  { opacity: 0.8; }
  35%  { opacity: 1; }
  65%  { opacity: 0.6; }
  100% { transform: translateX(110vw); opacity: 0; }
}

.app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 48px 32px 80px; }

/* ─── HEADER ─── */
.header { padding: 8px 0 38px; position: relative; }
.header::after {
  content: '';
  display: block; width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
  opacity: 0.3; margin-top: 24px;
}
.header-logos { display: flex; align-items: center; gap: 20px; }
.logo-slot {
  width: 52px; height: 52px;
  clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
  display: flex; align-items: center; justify-content: center;
  background: var(--surface);
  border: 1px solid rgba(0,229,255,0.15);
  box-shadow: 0 0 10px rgba(0,229,255,0.08);
  overflow: hidden; flex-shrink: 0; cursor: pointer;
  transition: all 0.3s;
  position: relative;
}
.logo-slot::before {
  content: '';
  position: absolute; inset: -1px;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  opacity: 0; transition: opacity 0.3s;
  clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
  z-index: -1;
}
.logo-slot.right {
  clip-path: none;
  border-radius: 8px;
}
.logo-slot.right::before {
  clip-path: none;
  border-radius: 8px;
}
.logo-slot:hover { border-color: transparent; }
.logo-slot:hover::before { opacity: 0.5; }
.logo-slot img { width: 100%; height: 100%; object-fit: contain; }
.logo-slot .logo-placeholder { font-size: 1rem; color: var(--muted); }
.header-text { flex: 1; }
.header h1 {
  font-size: 1.5rem; font-weight: 900; letter-spacing: 0.12em;
  line-height: 1.2;
  color: #e8f8ff;
  text-shadow: 0 0 18px rgba(128,216,255,0.7), 0 0 40px rgba(128,216,255,0.35), 0 0 70px rgba(179,136,255,0.2);
  animation: neonBoot 2s ease-out 1 forwards;
}
@keyframes neonBoot {
  0% { text-shadow: 0 0 4px rgba(128,216,255,0.2), 0 0 8px rgba(128,216,255,0.1); }
  15% { text-shadow: 0 0 30px rgba(128,216,255,0.9), 0 0 60px rgba(255,107,203,0.5); }
  30% { text-shadow: 0 0 8px rgba(128,216,255,0.3), 0 0 18px rgba(128,216,255,0.15); }
  45% { text-shadow: 0 0 24px rgba(128,216,255,0.8), 0 0 50px rgba(179,136,255,0.4); }
  100% { text-shadow: 0 0 18px rgba(128,216,255,0.7), 0 0 40px rgba(128,216,255,0.35), 0 0 70px rgba(179,136,255,0.2); }
}
.header .sub {
  font-size: 0.68rem; color: var(--cyan); letter-spacing: 0.22em; margin-top: 3px;
  font-family: var(--font-display);
  text-shadow: 0 0 10px rgba(0,229,255,0.5), 0 0 30px rgba(0,229,255,0.2);
}
.header .sub::before { content: '// '; color: var(--muted); }
.header .sub::after { content: ' //'; color: var(--muted); }

/* ─── STATS ─── */
.stats-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 0.8fr 0.8fr;
  gap: 14px; margin-bottom: 10px;
}
.stat-card {
  background: linear-gradient(180deg, rgba(15,23,38,0.95) 0%, rgba(10,16,27,0.92) 100%);
  border: 1px solid rgba(0,229,255,0.12);
  border-radius: 8px;
  padding: 18px 20px;
  transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: visible;
}
.stat-card::before {
  content: '';
  position: absolute; top: -1px; left: 16px; right: 16px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,229,255,0.45), transparent);
  box-shadow: 0 0 8px rgba(0,229,255,0.35);
  border-radius: 1px;
  transition: all 0.35s;
}
.stat-card::after {
  content: '';
  position: absolute; bottom: -1px; left: 30%; right: 30%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(224,64,251,0.2), transparent);
  opacity: 0.5; border-radius: 1px;
  transition: all 0.35s;
}
.stat-card .corner {
  position: absolute; top: -1px; left: -1px;
  width: 14px; height: 14px;
  border-top: 2px solid rgba(0,229,255,0.5);
  border-left: 2px solid rgba(0,229,255,0.5);
  border-radius: 3px 0 0 0;
  box-shadow: 0 0 6px rgba(0,229,255,0.3);
  transition: all 0.35s;
}
.stat-card:hover {
  border-color: rgba(0,229,255,0.4);
  transform: translateY(-3px);
  box-shadow: 0 0 30px rgba(0,229,255,0.14), 0 0 60px rgba(0,229,255,0.06), 0 12px 40px rgba(0,0,0,0.5);
}
.stat-card:hover::before {
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  box-shadow: 0 0 18px rgba(0,229,255,0.7), 0 0 36px rgba(0,229,255,0.35);
}
.stat-card:hover::after {
  background: linear-gradient(90deg, transparent, rgba(224,64,251,0.5), transparent);
  box-shadow: 0 0 18px rgba(224,64,251,0.5);
  opacity: 1;
}
.stat-card .label {
  font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em;
  margin-bottom: 8px; font-family: var(--font-display); text-transform: uppercase;
}
.stat-card .value { font-size: 1.65rem; font-weight: 900; letter-spacing: 0.04em; }
.stat-card .value.green { color: var(--green); text-shadow: 0 0 18px rgba(105,240,174,0.6), 0 0 40px rgba(105,240,174,0.2); }
.stat-card .value.red { color: var(--red); text-shadow: 0 0 18px rgba(255,82,82,0.6), 0 0 40px rgba(255,82,82,0.2); }
.stat-card .value.gold { color: var(--gold); text-shadow: 0 0 18px rgba(255,215,64,0.6), 0 0 40px rgba(255,215,64,0.2); }
.stat-card .value.cyan { color: var(--cyan); text-shadow: 0 0 18px rgba(0,229,255,0.6), 0 0 40px rgba(0,229,255,0.2); }
.stat-card .value.magenta { color: var(--magenta); text-shadow: 0 0 18px rgba(224,64,251,0.6), 0 0 40px rgba(224,64,251,0.2); }

/* ─── DIVIDER ─── */
hr.divider {
  border: none; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,229,255,0.35), rgba(224,64,251,0.35), rgba(0,229,255,0.35), transparent);
  margin: 24px 0 26px;
  box-shadow: 0 0 8px rgba(0,229,255,0.2);
}

/* ─── TOOLBAR ─── */
.toolbar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
}
.tab-group {
  display: flex; gap: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.tab {
  padding: 7px 18px; border-radius: 4px;
  border: 1px solid transparent; background: transparent;
  color: var(--muted); cursor: pointer;
  font-size: 0.76rem; font-family: var(--font-display); font-weight: 500;
  letter-spacing: 0.06em;
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
  position: relative;
}
.tab:not(:last-child)::after {
  content: '';
  position: absolute; right: -1px; top: 25%; height: 50%; width: 1px;
  background: var(--border);
}
.tab:hover { color: var(--text); background: rgba(0,229,255,0.04); border-color: rgba(0,229,255,0.1); }
.tab.active {
  color: var(--cyan); background: rgba(0,229,255,0.08);
  border-color: rgba(0,229,255,0.25);
  box-shadow: 0 0 14px rgba(0,229,255,0.12), inset 0 0 8px rgba(0,229,255,0.04);
  text-shadow: 0 0 12px rgba(0,229,255,0.5);
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
}

.btn {
  padding: 8px 20px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(15,23,38,0.95) 0%, rgba(10,16,27,0.98) 100%);
  color: var(--text2); cursor: pointer;
  font-size: 0.78rem; font-family: var(--font-display); font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  white-space: nowrap; position: relative; overflow: hidden;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  text-shadow: none;
}
.btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,229,255,0.08) 0%, transparent 50%, rgba(224,64,251,0.06) 100%);
  opacity: 0; transition: opacity 0.3s;
}
.btn::after {
  content: '';
  position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  transition: left 0.5s ease;
}
.btn:hover {
  border-color: rgba(0,229,255,0.5); color: var(--cyan);
  box-shadow: 0 0 16px rgba(0,229,255,0.2), 0 0 40px rgba(0,229,255,0.08), inset 0 1px 0 rgba(0,229,255,0.1);
  text-shadow: 0 0 12px rgba(0,229,255,0.5);
  transform: translateY(-1px);
}
.btn:hover::before { opacity: 1; }
.btn:hover::after { left: 120%; }
.btn:active { transform: translateY(0px) scale(0.98); transition-duration: 0.1s; box-shadow: 0 0 8px rgba(0,229,255,0.15), inset 0 1px 4px rgba(0,0,0,0.3); }
.btn.primary {
  background: linear-gradient(135deg, rgba(0,229,255,0.18) 0%, rgba(124,77,255,0.15) 100%);
  border-color: rgba(0,229,255,0.35); color: var(--cyan);
  box-shadow: 0 0 12px rgba(0,229,255,0.12);
}
.btn.primary:hover {
  background: linear-gradient(135deg, rgba(0,229,255,0.28) 0%, rgba(124,77,255,0.22) 100%);
  border-color: rgba(0,229,255,0.6); color: #fff;
  box-shadow: 0 0 24px rgba(0,229,255,0.3), 0 0 50px rgba(0,229,255,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  text-shadow: 0 0 14px rgba(0,229,255,0.7);
}
.btn.accent {
  background: linear-gradient(135deg, var(--magenta), var(--purple));
  border-color: rgba(224,64,251,0.4); color: #fff; font-weight: 600;
  box-shadow: 0 0 16px rgba(224,64,251,0.2), 0 0 40px rgba(224,64,251,0.08);
}
.btn.accent::before {
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%, rgba(255,255,255,0.06) 100%);
}
.btn.accent:hover {
  border-color: rgba(224,64,251,0.7); color: #fff;
  box-shadow: 0 0 28px rgba(224,64,251,0.4), 0 0 60px rgba(224,64,251,0.15), inset 0 1px 0 rgba(255,255,255,0.15);
  text-shadow: 0 0 12px rgba(255,255,255,0.5);
}
.btn.danger { color: var(--muted); }
.btn.danger:hover {
  border-color: rgba(255,82,82,0.5); color: var(--red); background: rgba(255,82,82,0.06);
  box-shadow: 0 0 16px rgba(255,82,82,0.2), 0 0 40px rgba(255,82,82,0.06), inset 0 1px 0 rgba(255,82,82,0.08);
  text-shadow: 0 0 10px rgba(255,82,82,0.5);
}

.search-box {
  background: rgba(10,16,27,0.9); border: 1px solid var(--border);
  border-radius: 4px;
  padding: 9px 16px; width: 210px;
  color: var(--text); font-size: 0.82rem; outline: none;
  font-family: var(--font); transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
}
.search-box:focus {
  border-color: rgba(0,229,255,0.5);
  box-shadow: 0 0 18px rgba(0,229,255,0.2), 0 0 40px rgba(0,229,255,0.06), inset 0 0 6px rgba(0,229,255,0.08);
}
.search-box::placeholder { color: var(--muted); }

/* ─── FILTER CHIP ─── */
.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 4px; cursor: pointer;
  background: rgba(255,214,64,0.06); border: 1px solid rgba(255,214,64,0.28);
  color: var(--gold); font-size: 0.76rem; letter-spacing: 0.04em;
  font-family: var(--font-display);
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
}
.filter-chip b { font-size: 0.86rem; }
.filter-chip:hover { background: rgba(255,214,64,0.12); box-shadow: 0 0 16px rgba(255,214,64,0.18); }
.filter-chip.on {
  background: rgba(255,214,64,0.9); color: #0a101b; border-color: var(--gold);
  box-shadow: 0 0 22px rgba(255,214,64,0.4);
}

/* ─── TOAST ─── */
#toast {
  position: fixed; left: 50%; bottom: 36px; z-index: 300;
  transform: translate(-50%, 14px); opacity: 0; pointer-events: none;
  padding: 11px 22px; border-radius: 4px;
  background: rgba(10,16,27,0.97); border: 1px solid var(--border);
  color: var(--text); font-size: 0.82rem; letter-spacing: 0.03em;
  clip-path: polygon(7px 0%, 100% 0%, calc(100% - 7px) 100%, 0% 100%);
  transition: opacity 0.32s cubic-bezier(0.16,1,0.3,1), transform 0.32s cubic-bezier(0.16,1,0.3,1);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.ok {
  color: var(--green); border-color: rgba(105,240,174,0.5);
  box-shadow: 0 0 26px rgba(105,240,174,0.2), 0 10px 34px rgba(0,0,0,0.55);
}
#toast.err {
  color: var(--red); border-color: rgba(255,82,82,0.5);

}

}

    transition-duration: 0.01ms !important;

/* ─── CHAT PANEL ─── */
.chat-toggle {
  position: fixed; bottom: 28px; right: 28px; z-index: 900;
  width: 54px; height: 54px;

}

<script>
// ─── DATA ──────────────────────────────
const INITIAL = [];
let items = [];

function safeFloat(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'string') { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  return 0;
}

// ─── CHIPSET / PLATFORM DETECTION ────────
function detectPlatform(model) {
  const m = model.toUpperCase();
  // GPU
  if (/RTX|GTX|RX\d{3,4}|ARC\s*A\d/i.test(m)) return '显卡';
  // RAM (容量 + G*2 或 结尾为G)
  if (/\d+G\*[12]/i.test(m) || /\d+G$/i.test(m) || /G\*2/i.test(m)) return '内存';
  // Storage (容量 + t/g/T/G)
  if (/\d+[TG]B?$/i.test(m) || /\d+[TG]\b/i.test(m)) return '硬盘';
  // Motherboard
  if (/B650|B850|X670|X870|A620/.test(m)) return 'AM5';
  if (/B550|B450|X570|X470|A520|A320/.test(m)) return 'AM4';
  if (/B860|Z890|H810/.test(m)) return 'LGA1851';
  if (/X99/.test(m)) return 'LGA2011';
  if (/X79/.test(m)) return 'LGA2011';
  if (/H610|B660|B760|Z690|Z790|H710|H770/.test(m)) return 'LGA1700';
  if (/Z590|Z490|B560|H510|B460|H410/.test(m)) return 'LGA1200';
  if (/liquid/i.test(m)) return '水冷';
  if (/^\d/.test(m)) return 'CPU';
  return '';
}
function detectChipset(model) {
  const m = model.toUpperCase();
  // GPU: extract RTX/GTX model
  const gpuMatch = m.match(/(RTX\s*\d{3,4}|GTX\s*\d{3,4})/i);
  if (gpuMatch) return gpuMatch[1].replace(/\s+/,'');
  // RAM: extract die brand from the descriptive model
  const ramDie = m.match(/(镁光|长鑫|海力士|三星|现代)/);
  if (ramDie) return ramDie[1];
  // Storage: extract model family
  const ssdMatch = m.match(/^([a-zA-Z]+\d+)/);
  if (ssdMatch) return ssdMatch[1].toLowerCase();
  // Motherboard chipset
  const mbMatch = m.match(/([BHQZX]\d{2,3}|A\d{3})/);
  return mbMatch ? mbMatch[1] : '';
}

function parseItems(raw) {
  raw.forEach((r, i) => { r._oi = i; });
  return raw.filter(r => {
    const b = (r.brand || '').trim();
    const m = (r.model || '').trim();
    const c = safeFloat(r.cost);
    if (!b && !m) return false;
    if (!b && !m && c > 50000) return false;
    if (b === 'Ʒ��' || b === 'Ʒ��') return false;
    return true;
  }).map((r, idx) => ({
    id: r._oi != null ? r._oi : idx,
    source_order_id: r.source_order_id || '',
    brand: (r.brand || '').trim(),
    model: (r.model || '').trim(),
    cost: safeFloat(r.cost),
    sell: safeFloat(r.sell),
    sn: r.sn || '',
    extra_price: safeFloat(r.extra_price) || 0,
    profit: safeFloat(r.sell) - safeFloat(r.cost),
    get platform() { return detectPlatform(this.model); },
    get chipset() { return detectChipset(this.model); },
    get margin() { return this.cost > 0 ? (this.profit / this.cost * 100) : 0; }
  }));
}

items = parseItems(INITIAL);

// ─── API ──────────────────────────────
const API = '/api/data';

let lastPayload = null;

// 返回新增记录条数；数据没变时返回 null，避免无谓重绘
async function loadPayload() {
  const res = await fetch(API);
  const text = await res.text();
  if (text === lastPayload) return null;
  const parsed = parseItems(JSON.parse(text));
  const gained = parsed.length - items.length;
  lastPayload = text;
  items = parsed;
  return gained;
}

async function fetchItems() {
  try {
    await loadPayload();
    render();
  } catch(e) { console.warn('API offline'); }
}

// ─── TOAST ────────────────────────────
let toastTimer = null;
function showToast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (kind || 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 4200);
}

// ─── LIVE SYNC ────────────────────────
let dirtyWhileEditing = false;

async function syncFromDisk() {
  if (document.getElementById('modal').classList.contains('active')) {
    dirtyWhileEditing = true;
    return;
  }
  try {
    const gained = await loadPayload();
    if (gained === null) return;
    render();
    if (gained > 0) showToast(`已同步 ${gained} 条新记录 · 账本现有 ${items.length} 条`);
  } catch (e) { console.warn('sync failed'); }
}

window.addEventListener('focus', syncFromDisk);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncFromDisk(); });

let editId = -1;

async function saveItem(record) {
  if (editId >= 0) {
    await fetch(API + '/' + editId, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(record) });
  } else {
    await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(record) });
  }
  await fetchItems();
  window._tplCache = null; // invalidate template cache
}

async function deleteItem(idx) {
  await fetch(API + '/' + idx, { method: 'DELETE' });
  await fetchItems();
  window._tplCache = null;
}

// ─── STATS ──────────────────────────────
function fmt(n) { return n.toLocaleString('zh-CN', { minimumFractionDigits:0, maximumFractionDigits:0 }); }

function updateStats() {
  const totalCost = items.reduce((s,i) => s + i.cost, 0);
  const totalSell = items.reduce((s,i) => s + i.sell, 0);
  const totalProfit = totalSell - totalCost;
  const totalMargin = totalCost > 0 ? (totalProfit / totalCost * 100) : 0;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="corner"></div><div class="label">总利润</div><div class="value green">¥${fmt(totalProfit)}</div></div>
    <div class="stat-card"><div class="corner"></div><div class="label">总成本</div><div class="value red">¥${fmt(totalCost)}</div></div>
    <div class="stat-card"><div class="corner"></div><div class="label">总售价</div><div class="value gold">¥${fmt(totalSell)}</div></div>
    <div class="stat-card"><div class="corner"></div><div class="label">总交易</div><div class="value cyan">${items.length} 笔</div></div>
    <div class="stat-card"><div class="corner"></div><div class="label">利润率</div><div class="value magenta">${totalMargin.toFixed(1)}%</div></div>
  `;
  document.getElementById('footer').textContent = `NEON LEDGER · 利润 ¥${fmt(totalProfit)} · ${items.length} 条记录`;

  const pending = items.reduce((n, i) => n + (i.sell > 0 ? 0 : 1), 0);
  const chip = document.getElementById('pendingChip');
  chip.hidden = pending === 0;
  chip.classList.toggle('on', pendingOnly);
  document.getElementById('pendingCount').textContent = pending;
}

// ─── BRAND AGGREGATION ──────────────────
function buildBrands() {
  const map = {};
  items.forEach(i => {
    if (!map[i.brand]) map[i.brand] = { brand: i.brand, count: 0, cost: 0, sell: 0, models: {} };
    map[i.brand].count++;
    map[i.brand].cost += i.cost;
    map[i.brand].sell += i.sell;
    if (!map[i.brand].models[i.model]) map[i.brand].models[i.model] = { model: i.model, count:0, cost:0, sell:0 };
    map[i.brand].models[i.model].count++;
    map[i.brand].models[i.model].cost += i.cost;
    map[i.brand].models[i.model].sell += i.sell;
  });
  return Object.values(map).map(b => ({
    ...b, profit: b.sell - b.cost,
    margin: b.cost > 0 ? ((b.sell - b.cost) / b.cost * 100) : 0,
  })).sort((a,b) => b.profit - a.profit);
}

const barColors = ['cyan', 'magenta', 'purple', 'green', 'gold'];
let currentView = 'brands';
let searchTerm = '';
let sortKey = null;
let sortDir = 'asc';
let pendingOnly = false;

function sortArrow(key) {
  if (sortKey !== key) return ' <span class="sort-arrow">▴▾</span>';
  return sortDir === 'asc'
    ? ' <span class="sort-arrow">▴</span>'
    : ' <span class="sort-arrow">▾</span>';
}

function sortByKey(arr, key) {
  return [...arr].sort((a, b) => {
    const va = typeof a[key] === 'function' ? a[key] : (a[key] ?? 0);
    const vb = typeof b[key] === 'function' ? b[key] : (b[key] ?? 0);
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir === 'asc' ? va - vb : vb - va;
  });
}

function togglePending() {
  pendingOnly = !pendingOnly;
  if (pendingOnly && currentView !== 'models') {
    currentView = 'models';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'models'));
  }
  render();
}

// ─── BRAND ICONS ──────────────────────────
const BRAND_STYLES = {
  '微星': { bg: '#c8a000', fg: '#000000', ring: '#ffd740', ch: '微' },
  '华硕': { bg: '#00539b', fg: '#ffffff', ring: '#0088ff', ch: '硕' },
  '技嘉': { bg: 'split', fg: '#ffffff', ring: '#ff4040', ring2: '#0066cc', ch: '嘉' },
  '七彩虹': { bg: '#cc0000', fg: '#ffffff', ring: '#ff3333', ch: '虹' },
  '铭瑄': { bg: '#00c853', fg: '#ffffff', ring: '#69f0ae', ch: '铭' },
  'amd': { bg: '#ff6d00', fg: '#ffffff', ring: '#ff9100', ch: 'A' },
  'inter': { bg: '#0071c5', fg: '#ffffff', ring: '#00a0ff', ch: 'I' },
};
function brandIcon(brand) {
  const s = BRAND_STYLES[brand.toLowerCase()] || BRAND_STYLES[brand] || { bg: '#444', fg: '#fff', ring: '#666', ch: brand[0] || '?' };
  var grad, stroke;
  if (s.bg === 'split') {
    grad = `<linearGradient id="bg-${s.ch}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${s.ring}"/><stop offset="100%" stop-color="${s.ring2}"/></linearGradient>`;
    stroke = s.ring;
  } else {
    grad = `<linearGradient id="bg-${s.ch}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${s.ring}"/><stop offset="100%" stop-color="${s.bg}"/></linearGradient>`;
    stroke = s.ring;
  }
  return `<svg width="28" height="28" viewBox="0 0 20 20" style="vertical-align:-7px;margin-right:7px;flex-shrink:0;filter:drop-shadow(0 0 3px ${stroke}88)"><defs>${grad}</defs><rect x="1" y="1" width="18" height="18" rx="3" fill="url(#bg-${s.ch})" stroke="${stroke}" stroke-width="0.6" opacity="0.93"/><text x="10" y="14.5" text-anchor="middle" fill="${s.fg}" font-size="11" font-weight="900" font-family="'Microsoft YaHei','PingFang SC',sans-serif">${s.ch}</text></svg>`;
}

function renderBrands() {
  const brands = buildBrands();
  const filtered = brands.filter(b => {
    if (!searchTerm) return true;
    const q = searchTerm.toLowerCase();
    return b.brand.toLowerCase().includes(q) || Object.keys(b.models).some(m => m.toLowerCase().includes(q));
  });

  const sorted = sortKey ? sortByKey(filtered, sortKey) : filtered;
  const maxProfit = Math.max(...sorted.map(b => b.profit), 1);

  const mkTh = (key, label) => `<th data-sort="${key}"${sortKey === key ? ' class="sorted"' : ''}>${label}${sortArrow(key)}</th>`;

  document.getElementById('tableHead').innerHTML = `
    <tr>${mkTh('brand','品牌')}${mkTh('count','数量')}${mkTh('cost','成本')}${mkTh('sell','售价')}${mkTh('profit','利润')}${mkTh('margin','利润率')}<th class="bar-cell">占比</th></tr>`;

  document.getElementById('tableBody').innerHTML = sorted.map((b, idx) => {
    const barW = Math.max((b.profit / maxProfit * 100), 1);
    const pClass = b.profit >= 0 ? 'profit-positive' : 'profit-negative';
    return `
    <tr class="clickable" onclick="toggleBrand('${esc(b.brand)}', this)">
      <td><span class="expand-arrow">▶</span> ${brandIcon(b.brand)}<strong>${esc(b.brand)}</strong></td>
      <td>${b.count}</td><td>¥${fmt(b.cost)}</td><td>¥${fmt(b.sell)}</td>
      <td class="${pClass}">¥${fmt(b.profit)}</td>
      <td><span class="badge ${b.profit >= 0 ? 'badge-profit' : 'badge-loss'}">${b.margin.toFixed(1)}%</span></td>
      <td class="bar-cell"><div class="bar-wrap"><div class="bar ${barColors[idx % barColors.length]}" style="width:${barW}%"></div><span style="font-size:0.66rem;color:var(--muted);white-space:nowrap">${barW.toFixed(0)}%</span></div></td>
    </tr>
    <tr class="model-detail" id="detail-${esc(b.brand)}">
      <td colspan="7">
        <table class="model-table">
          <thead><tr><th>型号</th><th>数量</th><th>成本</th><th>售价</th><th>利润</th><th>利润率</th></tr></thead>
          <tbody>${Object.values(b.models).sort((a,b) => (b.sell-b.cost)-(a.sell-a.cost)).map(m => {
            const mp = m.sell - m.cost;
            const mm = m.cost > 0 ? (mp/m.cost*100) : 0;
            return `<tr><td>${esc(m.model)}</td><td>${m.count}</td><td>¥${fmt(m.cost)}</td><td>¥${fmt(m.sell)}</td><td class="${mp>=0?'profit-positive':'profit-negative'}">¥${fmt(mp)}</td><td><span class="badge ${mp>=0?'badge-profit':'badge-loss'}">${mm.toFixed(1)}%</span></td></tr>`;
          }).join('')}</tbody>
        </table>
      </td>
    </tr>`;
  }).join('');
}

function renderModels() {
  const all = items.map((i, idx) => ({ ...i, origIdx: i.id }));
  const visible = pendingOnly ? all.filter(i => !i.sell) : all;
  const filtered = searchTerm
    ? visible.filter(i => i.brand.toLowerCase().includes(searchTerm.toLowerCase()) || i.model.toLowerCase().includes(searchTerm.toLowerCase()))
    : visible;

  const sorted = sortKey ? sortByKey(filtered, sortKey) : [...filtered].sort((a,b) => b.profit - a.profit);

  const mkTh = (key, label) => `<th data-sort="${key}"${sortKey === key ? ' class="sorted"' : ''}>${label}${sortArrow(key)}</th>`;

  document.getElementById('tableHead').innerHTML = `
    <tr>${mkTh('brand','品牌')}${mkTh('model','型号')}${mkTh('cost','成本')}${mkTh('sell','售价')}${mkTh('profit','利润')}${mkTh('margin','利润率')}<th>图片</th><th>操作</th></tr>`;

  document.getElementById('tableBody').innerHTML = sorted
    .map(i => {
      const pClass = i.profit >= 0 ? 'profit-positive' : 'profit-negative';

function platformBadge(p) {
  if (!p) return '';
  const cls = `platform-${p}`;
  return `<span class="platform-badge ${cls}">${p}</span>`;
}

function renderChipsets() {
  const map = {};
  items.forEach(i => {
    const chip = i.chipset || '其他';
    if (!map[chip]) map[chip] = { chipset: chip, count: 0, cost: 0, sell: 0, platforms: {}, models: {} };
    map[chip].count++;
    map[chip].cost += i.cost;
    map[chip].sell += i.sell;
    const pf = i.platform || '未知';
    if (!map[chip].platforms[pf]) map[chip].platforms[pf] = { platform: pf, count: 0, cost: 0, sell: 0 };
    map[chip].platforms[pf].count++;
    map[chip].platforms[pf].cost += i.cost;
    map[chip].platforms[pf].sell += i.sell;
    if (!map[chip].models[i.model]) map[chip].models[i.model] = { model: i.model, count: 0, cost: 0, sell: 0, platform: i.platform };
    map[chip].models[i.model].count++;
    map[chip].models[i.model].cost += i.cost;
    map[chip].models[i.model].sell += i.sell;
  });
  const chips = Object.values(map).map(c => ({
    ...c, profit: c.sell - c.cost,
    margin: c.cost > 0 ? ((c.sell-c.cost)/c.cost*100) : 0,
  }));

  const sorted = sortKey ? sortByKey(chips, sortKey) : [...chips].sort((a,b) => b.count - a.count);

  const mkTh = (key, label) => `<th data-sort="${key}"${sortKey === key ? ' class="sorted"' : ''}>${label}${sortArrow(key)}</th>`;

  document.getElementById('tableHead').innerHTML = `<tr>${mkTh('chipset','芯片组')}<th>平台</th>${mkTh('count','数量')}${mkTh('cost','成本')}${mkTh('sell','售价')}${mkTh('profit','利润')}${mkTh('margin','利润率')}</tr>`;
  document.getElementById('tableBody').innerHTML = sorted.map(c => {
    const pStr = Object.values(c.platforms).map(p => platformBadge(p.platform)).join('');
    const pClass = c.profit >= 0 ? 'profit-positive' : 'profit-negative';
    return `
    <tr class="clickable" onclick="toggleBrand('chip-${c.chipset}', this)">
      <td><span class="expand-arrow">▶</span> <strong>${esc(c.chipset)}</strong></td>
      <td>${pStr}</td>
      <td>${c.count}</td><td>¥${fmt(c.cost)}</td><td>¥${fmt(c.sell)}</td>
      <td class="${pClass}">¥${fmt(c.profit)}</td>
      <td><span class="badge ${c.profit>=0?'badge-profit':'badge-loss'}">${c.margin.toFixed(1)}%</span></td>
    </tr>
    <tr class="model-detail" id="detail-chip-${c.chipset}">
      <td colspan="7">
        <table class="model-table">
          <thead><tr><th>型号</th><th>平台</th><th>数量</th><th>成本</th><th>售价</th><th>利润</th><th>利润率</th></tr></thead>
          <tbody>${Object.values(c.models).sort((a,b)=>b.count-a.count).map(m => {
            const mp = m.sell - m.cost;
            const mm = m.cost > 0 ? (mp/m.cost*100) : 0;
            return `<tr><td>${esc(m.model)}</td><td>${platformBadge(m.platform)}</td><td>${m.count}</td><td>¥${fmt(m.cost)}</td><td>¥${fmt(m.sell)}</td><td class="${mp>=0?'profit-positive':'profit-negative'}">¥${fmt(mp)}</td><td><span class="badge ${mp>=0?'badge-profit':'badge-loss'}">${mm.toFixed(1)}%</span></td></tr>`;
          }).join('')}</tbody>
        </table>
      </td>
    </tr>`;
  }).join('');
}

function render() {
  updateStats();
  if (currentView === 'brands') renderBrands();
  else if (currentView === 'models') renderModels();
  else if (currentView === 'chipsets') renderChipsets();
  else if (currentView === 'ranking') renderRanking();
}

// ─── INTERACTIONS ────────────────────────
function toggleBrand(brand, row) {
  const el = document.getElementById('detail-' + brand);
  if (!el) return;
  el.classList.toggle('active');
  if (row) {
    const arrow = row.querySelector('.expand-arrow');
    if (arrow) arrow.classList.toggle('open', el.classList.contains('active'));
  }
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

document.getElementById('tabs').addEventListener('click', e => {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentView = e.target.dataset.view;
    if (currentView !== 'models') pendingOnly = false;
    sortKey = null; sortDir = 'asc';
    render();
  }
});

document.getElementById('tableHead').addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  const key = th.dataset.sort;
  if (sortKey === key) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortKey = key;
    sortDir = 'asc';
  }
  render();
});

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

  document.getElementById('modalSubmit').textContent = '添加';
  document.getElementById('fBrand').value = '';
  document.getElementById('fModel').value = '';
  document.getElementById('fCost').value = '';
  document.getElementById('fSell').value = '';
  document.getElementById('fSN').value = '';
  document.getElementById('fExtra').value = '';
  document.getElementById('fAccessory').value = '';

  document.getElementById('fSN2').value = i.sn2 || '';

function closeModal() {

document.getElementById('modalSubmit').addEventListener('click', async () => {
  const record = {
    brand: document.getElementById('fBrand').value.trim(),
    model: document.getElementById('fModel').value.trim(),
    cost: parseFloat(document.getElementById('fCost').value) || 0,
    sell: parseFloat(document.getElementById('fSell').value) || 0,
    sn: document.getElementById('fSN').value.trim(),
    extra_price: parseFloat(document.getElementById('fExtra').value) || 0,
    accessory: document.getElementById('fAccessory').value.trim(),

  };

    await fetchItems();

let priceDebounceTimer = null;
function fetchPriceHint(brand, model) {
  const hint = document.getElementById('priceHint');
  if (!brand || !model) { hint.style.display = 'none'; return; }
  clearTimeout(priceDebounceTimer);
  priceDebounceTimer = setTimeout(async () => {
    try {
      const res = await fetch(`/api/prices?brand=${encodeURIComponent(brand)}&model=${encodeURIComponent(model)}`);
      const data = await res.json();
      if (data.count > 0) {
        hint.innerHTML = `参考售价: ¥${data.sell_min|0}-${data.sell_max|0} | 均价 ¥${(data.sell_avg||0)|0} <span style="opacity:0.6">(${data.count}笔)</span>`;
        hint.style.cssText = 'display:block;color:var(--cyan);background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.2);text-shadow:0 0 8px rgba(0,229,255,0.3)';
      } else {
        hint.textContent = '暂无历史数据';
        hint.style.cssText = 'display:block;color:var(--muted);background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);text-shadow:none';
      }
    } catch (e) { hint.style.display = 'none'; }
  }, 500);
}

let logoUploadTarget = 'left';

function uploadLogo(side) {
  logoUploadTarget = side;
  document.getElementById('logoInput').click();
}

function handleLogoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const slotId = logoUploadTarget === 'left' ? 'logoLeft' : 'logoRight';
    const slot = document.getElementById(slotId);
    const img = slot.querySelector('img');
    const placeholder = slot.querySelector('.logo-placeholder');
    img.src = ev.target.result;
    img.style.display = '';
    if (placeholder) placeholder.style.display = 'none';
    try {
      localStorage.setItem('msi-logo-' + logoUploadTarget, ev.target.result);
    } catch(ex) {}
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

(function restoreLogos() {
  ['left', 'right'].forEach(side => {
    const saved = localStorage.getItem('msi-logo-' + side);
    if (saved) {
      const slotId = side === 'left' ? 'logoLeft' : 'logoRight';
      const slot = document.getElementById(slotId);
      const img = slot.querySelector('img');
      const placeholder = slot.querySelector('.logo-placeholder');
      img.src = saved;
      img.style.display = '';
      if (placeholder) placeholder.style.display = 'none';
    }
  });
})();

// ─── CSV IMPORT ──────────────────────────
function importCSV() {
  document.getElementById('csvFileInput').click();
}

async function handleCSVUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const text = await file.text();
  try {
    const res = await fetch('/api/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ csv_text: text, skip_duplicates: true })
    });
    const result = await res.json();
    if (result.ok) {
      let msg = `导入完成！成功: ${result.imported} 条`;
      if (result.skipped > 0) msg += `，跳过重复: ${result.skipped} 条`;
      if (result.errors.length > 0) {
        msg += `\n\n错误详情:\n${result.errors.map(e => `第${e.line}行: ${e.error}`).join('\n')}`;
      }
      alert(msg);
      fetchItems();
    } else {
      alert('���入失败: ' + (result.error || '未知错误'));
    }
  } catch (e) {
    alert('导入失败: ' + e.message);
  }
  event.target.value = '';
}

// ─── OCR RECOGNITION ────────────────────
function parseOCRText(text) {
  const knownBrands = ['微星', '华硕', '技嘉', '七彩虹', '铭瑄', '英睿达', '金百达', '影驰', 'AMD', 'INTER', 'OLOY'];
  let brand = '';
  for (const b of knownBrands) {
    if (text.includes(b)) { brand = b; break; }
  }
  const modelPatterns = [
    /([BHQZX]\d{2,3}[a-zA-Z-]*[一-鿿]*(?:\s*(?:gaming|wifi|pro|plus|edge|tomahawk|迫击炮|爆破弹|重炮手|小雕|电竞之心))?)/i,
    /(RTX\s*\d{3,4}[a-zA-Z]*)/i,
    /(GTX\s*\d{3,4}[a-zA-Z]*)/i,
    /(liquid\s*\w*\d*)/i,
    /(M?die\s*\d+G)/i,
    /([A-Z]\d{3}[a-zA-Z-]*)/,
  ];
  let model = '';
  for (const pat of modelPatterns) {
    const m = text.match(pat);
    if (m) { model = m[1].trim(); break; }
  }
  const priceMatches = [...text.matchAll(/[¥￥]\s*(\d{2,5})/g)];
  let prices = priceMatches.map(m => parseInt(m[1])).filter(p => p > 10 && p < 50000);
  let price = prices.length > 0 ? Math.max(...prices) : '';
  return { brand, model, price };
}

async function handleOCRUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (typeof Tesseract === 'undefined') {
    alert('OCR引擎加载中，请稍后再试');
    event.target.value = '';
    return;
  }
  document.getElementById('ocrBtn').textContent = '识别中...';
  document.getElementById('ocrBtn').disabled = true;
  try {
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = dataUrl;
    });
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const { data: { text } } = await Tesseract.recognize(canvas, 'chi_sim+eng', {
      logger: m => { if (m.status === 'recognizing text') document.getElementById('ocrBtn').textContent = `识别中 ${Math.round(m.progress*100)}%`; }
    });
    const result = parseOCRText(text);
    await openAddModal();
    if (result.brand) document.getElementById('fBrand').value = result.brand;
    if (result.model) document.getElementById('fModel').value = result.model;
    if (result.price) document.getElementById('fSell').value = result.price;
    document.getElementById('templateField').style.display = 'none';
    // show OCR warning
    const title = document.getElementById('modalTitle');
    title.textContent = '新增记录 — OCR识别结果仅供参考';
    title.style.color = 'var(--amber)';
    setTimeout(() => { title.style.color = ''; }, 5000);
  } catch (e) {
    console.error('OCR failed:', e);
    alert('OCR识别失败，请手动输入');
  }
  document.getElementById('ocrBtn').textContent = 'OCR识别';
  document.getElementById('ocrBtn').disabled = false;
  event.target.value = '';
}

// ─── CHAT PANEL ─────────────────────────────
function toggleChat() {
  const panel = document.getElementById('chatPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    document.getElementById('chatInput').focus();
  }
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  const messages = document.getElementById('chatMessages');
  messages.innerHTML += `<div class="chat-msg user">${esc(msg)}</div>`;
  messages.innerHTML += `<div class="chat-msg ai" id="chatTyping"><span style="color:var(--muted)">思考中...</span></div>`;
  messages.scrollTop = messages.scrollHeight;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    const typing = document.getElementById('chatTyping');
    if (typing) typing.removeAttribute('id');
    let reply = data.reply || data.error || '无响应';
    if (data.steps && data.steps.length > 0) {
      const stepsHtml = data.steps.map(s => `<div style="font-size:11px;color:var(--muted);padding:2px 0;border-bottom:1px solid var(--border)">🔧 ${esc(s)}</div>`).join('');
      reply = `<details style="margin-bottom:6px"><summary style="cursor:pointer;color:var(--cyan);font-size:11px">推理过程 (${data.steps.length}步)</summary>${stepsHtml}</details>${reply}`;
    }
    messages.innerHTML += `<div class="chat-msg ai">${reply}</div>`;
  } catch (e) {
    messages.innerHTML += `<div class="chat-msg ai" style="color:var(--red)">请求失败: ${esc(e.message)}</div>`;
  }
  messages.scrollTop = messages.scrollHeight;
}

// ─── SMART ENTRY ────────────────────────────
function toggleSmartEntry() {
  document.getElementById('smartEntry').classList.toggle('open');
}

async function smartParse() {
  const input = document.getElementById('smartInput');
  const text = input.value.trim();
  if (!text) return;
  const resultDiv = document.getElementById('smartResult');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = '<span style="color:var(--cyan)">解析中...</span>';
  try {
    const res = await fetch('/api/smart-parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.error) { resultDiv.innerHTML = `<span style="color:var(--red)">${esc(data.error)}</span>`; return; }
    await openAddModal();
    const fieldMap = { brand: 'fBrand', model: 'fModel', cost: 'fCost', sell: 'fSell', sn: 'fSN', accessory: 'fAccessory', accessory_price: 'fAccPrice', extra_price: 'fExtra' };
    let filled = [];
    for (const [key, id] of Object.entries(fieldMap)) {
      if (data[key] !== undefined && data[key] !== null && data[key] !== '') {
        document.getElementById(id).value = data[key];
        filled.push(key);
      }
    }
    resultDiv.innerHTML = `<span style="color:var(--green)">已解析并填充 ${filled.length} 个字段: ${filled.join(', ')}</span>`;
    input.value = '';
  } catch (e) {
    resultDiv.innerHTML = `<span style="color:var(--red)">解析失败: ${esc(e.message)}</span>`;
  }
}

// ─── IMAGE UPLOAD ───────────────────────────
function handleImageSelect(event) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  if (!window._pendingImages) window._pendingImages = [];
  const previewList = document.getElementById('imgPreviewList');
  files.forEach(file => {
    window._pendingImages.push(file);
    const reader = new FileReader();
    reader.onload = (e) => {
      const div = document.createElement('div');
      div.style.cssText = 'display:inline-block;position:relative';
      div.innerHTML = `<img src="${e.target.result}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--border)">`;
      previewList.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

function removeExistingImage(idx) {
  const item = items[idx];
  if (!item) return;
  const imgs = Array.isArray(item.images) ? [...item.images] : (item.images ? [item.images] : []);
  const filename = imgs[idx];
  if (filename) {
    fetch('/api/data/' + idx + '/images/' + encodeURIComponent(filename), { method: 'DELETE' }).then(() => fetchItems());
  }
}

// ─── IMAGE VIEWER ───────────────────────────
let _viewerImages = [];
let _viewerIdx = 0;

function openImageViewer(images, startIdx) {
  _viewerImages = images;
  _viewerIdx = startIdx || 0;
  const overlay = document.getElementById('imgViewer');
  overlay.style.display = 'flex';
  _updateViewer();
}

function closeImageViewer(event) {
  if (event && event.target.tagName === 'BUTTON') return;
  document.getElementById('imgViewer').style.display = 'none';
}

function imgViewerNav(dir) {
  _viewerIdx = (_viewerIdx + dir + _viewerImages.length) % _viewerImages.length;
  _updateViewer();
}

function _updateViewer() {
  const img = _viewerImages[_viewerIdx];
  const src = img && img.startsWith('http') ? img : '/api/images/' + img;
  document.getElementById('imgViewerImg').src = src;
  document.getElementById('imgViewerCounter').textContent = `${_viewerIdx + 1} / ${_viewerImages.length}`;
}

<script>
// ─── PARTICLE SYSTEM ──────────────────────
(function() {
  const canvas = document.getElementById('particles');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const COLORS = ['#80d8ff','#ff6bcb','#b388ff','#e040fb','#40c4ff','#ff80ab','#aa80ff'];
  const COUNT = 80;
  let W, H;
  const particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() {
      this.reset(true);
    }
    reset(initial) {
      this.x = initial ? Math.random() * W : (Math.random() < 0.5 ? -30 : W + 30);
      this.y = initial ? Math.random() * H : H + 30;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = -0.3 - Math.random() * 0.9;
      this.size = 0.6 + Math.random() * 2.2;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.baseAlpha = 0.15 + Math.random() * 0.5;
      this.twinkle = Math.random() * Math.PI * 2;
      this.twinkleSpeed = 0.008 + Math.random() * 0.025;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.y < -40) { this.y = H + 30; this.x = Math.random() * W; }
      if (this.y > H + 40) { this.y = -30; this.x = Math.random() * W; }
      if (this.x < -40) this.x = W + 30;
      if (this.x > W + 40) this.x = -30;
      this.twinkle += this.twinkleSpeed;
    }
    draw() {
      this.alpha = this.baseAlpha * (0.6 + 0.4 * Math.sin(this.twinkle));
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
      const r = parseInt(this.color.slice(1,3), 16);
      const g = parseInt(this.color.slice(3,5), 16);
      const b = parseInt(this.color.slice(5,7), 16);
      ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha * 0.25})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  for (let i = 0; i < COUNT; i++) particles.push(new Particle());

  function drawLines() {
    const max = 100;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < max) {
          const a = (1 - d / max) * 0.1;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(160,160,240,${a})`;
          ctx.lineWidth = 0.35;
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    drawLines();
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
